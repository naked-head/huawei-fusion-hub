name: Bug Report
description: Report a problem with the Huawei Fusion Hub integration
body:
  - type: markdown
    attributes:
      value: |
        ## Before you continue

        This integration **does not talk to your inverter or to any Huawei cloud service**. It only reads entity states that the source integrations ([Huawei Solar](https://github.com/wlcrs/huawei_solar), [FusionSolar](https://github.com/tijsverkoyen/HomeAssistant-FusionSolar), [FusionSolarPlus](https://github.com/JortvanSchijndel/FusionSolarPlus)) have already published in Home Assistant.
        So if a value is wrong, the first question is always: **is it wrong here, or was it already wrong at the source?** Every hub sensor exposes `source` and `source_entity` attributes — open the entity, look at those two, then compare the hub value with the source entity's own value. If they match the problem is upstream and needs to be reported there, where the maintainer can actually act on it.
        The quickest way to answer most of the questions below at once is the diagnostics download: **Settings → Devices & Services → Huawei Fusion Hub → three-dot menu → Download diagnostics**. It contains the version, the configured sources, which source won for every canonical key, and — if the battery runtime estimates are on — what the estimator last saw. Credentials and plant identifiers are redacted automatically; entity IDs are not, so give the file a glance before posting.
        Please paste logs and configuration **here as text**, not as email attachments or external links. The diagnostics JSON can be attached as a file.

  - type: checkboxes
    id: confirm-scope
    attributes:
      label: Confirm this report belongs here
      options:
        - label: >-
            I am aware that naked-head is a grumpy maintainer, so it can happen that
            my issue will be closed quickly when essential information is missing
            (no logs, no version, no description, etc.).
          required: true
        - label: >-
            This is about the hub's own behavior — aggregation, failover, entity
            creation, options — and not about a value that is already wrong in the
            source integration.
          required: true
        - label: >-
            I have checked the `source` and `source_entity` attributes of the
            affected hub entity, and compared its value with the source entity it
            points to.
          required: true
        - label: I have read the README before opening this issue.
          required: true
        - label: My Home Assistant version is up to date.
          required: true
        - label: >-
            I am using the latest release of this integration (or the latest
            pre-release, if I am testing a beta).
          required: true
        - label: >-
            I have checked existing issues (including closed ones) to make sure
            this isn't a duplicate.
          required: true
        - label: I have prepared DEBUG log output for this report.
          required: true
        - label: >-
            I have downloaded the diagnostics file, checked it for anything I would
            rather not publish, and attached it below.
          required: true
        - label: >-
            I confirm this is really an issue with the integration, and not a
            question or a request for general Home Assistant support.
          required: true
        - label: |
            I confirm that I did not actually read any of the points above and just checked them all. |
            I didn't want to waste time on details, so I skipped reading or following any existing instructions. |
            Instead, I'd like naked-head to spend their free time explaining things to me — that's what open source is for, right? |
            I live by the motto: better to ask twice than think once. |
            It's naked-head's own fault for offering open-source software and free support.

  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: Found in Settings → Devices & Services → Huawei Fusion Hub → three-dot menu → Integration information, or in CHANGELOG.md.
      placeholder: "e.g. 0.9.0"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Found in Settings → About.
      placeholder: "e.g. 2026.7.1"
    validations:
      required: true

  - type: dropdown
    id: ha_installation
    attributes:
      label: Home Assistant installation type
      options:
        - Home Assistant OS
        - Home Assistant Supervised
        - Home Assistant Container
        - Home Assistant Core
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly. What did you do, what did you expect, what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: affected_entities
    attributes:
      label: Affected entities
      description: |
        The hub entities involved, with their `source` and `source_entity` attributes,
        and the current value of the source entity they point to.
      placeholder: |
        sensor.hf_hub_battery_soc = 47
          source: huawei_solar
          source_entity: sensor.batteria_state_of_capacity = 63
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Settings → Devices & Services → Huawei Fusion Hub → three-dot menu →
        **Download diagnostics**. Attach the JSON file by dragging it into this
        box, or paste its contents.

        If the report is about the battery runtime estimates, this file carries
        the whole picture: the conversion factor in use, the estimate's own
        confidence, and the SoC and power the estimator was reading. Without it
        those have to be asked for one at a time.
      render: json
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Enable debug logging first — add this to `configuration.yaml`, restart HA,
        reproduce the issue, then paste the relevant lines here.

        ```yaml
        logger:
          default: warning
          logs:
            custom_components.huawei_fusion_hub: debug
        ```
      render: text
    validations:
      required: true

  - type: checkboxes
    id: sources
    attributes:
      label: Configured sources
      description: Which source integrations are enabled, and in what priority order?
      options:
        - label: Huawei Solar (Modbus)
        - label: FusionSolar
        - label: FusionSolarPlus
        - label: Aggregate controls enabled
        - label: Disconnect notifications enabled

  - type: input
    id: priority_order
    attributes:
      label: Priority order
      description: >-
        The order in which sources are prioritized, highest first. Skip this if
        you attached the diagnostics file — it is in there.
      placeholder: "e.g. Huawei Solar → FusionSolar → FusionSolarPlus"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might be relevant — automations, Lovelace cards, other integrations, etc.
    validations:
      required: false
